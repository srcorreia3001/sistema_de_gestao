{% extends "base.html" %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- Formulário de Cadastro -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">Novo Aluno / Membro</h2>
        <form action="/adicionar-aluno" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nome Completo</label>
                <input type="text" name="nome" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Idade</label>
                <input type="number" name="idade" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Função / Tipo</label>
                <select name="tipo" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="Aluno">Aluno</option>
                    <option value="Professor">Professor</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Turma ID (Ex: 1 ou 2)</label>
                <input type="number" name="turma_id" value="1" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition-colors">
                Cadastrar Aluno
            </button>
        </form>
    </div>

    <!-- Listagem de Cadastrados -->
    <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100">Alunos Cadastrados no Banco Local</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider">
                        <th class="py-3 px-4 border-b">ID</th>
                        <th class="py-3 px-4 border-b">Nome</th>
                        <th class="py-3 px-4 border-b">Idade</th>
                        <th class="py-3 px-4 border-b">Função</th>
                    </tr>
                </thead>
                <tbody class="text-sm divide-y divide-slate-100">
                    {% for aluno in alunos %}
                    <tr class="hover:bg-slate-50">
                        <td class="py-3 px-4">{{ aluno.id }}</td>
                        <td class="py-3 px-4 font-medium text-slate-900">{{ aluno.nome }}</td>
                        <td class="py-3 px-4">{{ aluno.idade }} anos</td>
                        <td class="py-3 px-4">
                            <span class="px-2.5 py-1 text-xs rounded-full font-semibold {% if aluno.tipo == 'Professor' %} bg-purple-100 text-purple-700 {% else %} bg-emerald-100 text-emerald-700 {% endif %}">
                                {{ aluno.tipo }}
                            </span>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="py-6 text-center text-slate-400">Nenhum aluno cadastrado ainda.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</div>
{% endblock %}
